<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Resume Analysis Result</title>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            font-family:Arial,sans-serif;

            background:
                    linear-gradient(rgba(0,0,0,0.7),
                    rgba(0,0,0,0.7)),

                    url('https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?q=80&w=1974&auto=format&fit=crop');

            background-size:cover;
            background-position:center;

            min-height:100vh;

            color:white;
        }

        .main-container{

            padding:60px 20px;
        }

        .result-card{

            max-width:900px;

            margin:auto;

            background:rgba(255,255,255,0.12);

            backdrop-filter:blur(18px);

            border:1px solid rgba(255,255,255,0.2);

            border-radius:30px;

            padding:45px;

            box-shadow:0 8px 40px rgba(0,0,0,0.4);
        }

        .title{

            text-align:center;

            margin-bottom:35px;
        }

        .title h1{

            font-size:48px;

            font-weight:800;
        }

        .title p{

            color:#dcdcdc;

            margin-top:10px;
        }

        .score-section{

            text-align:center;

            margin-bottom:40px;
        }

        .score-circle{

            width:180px;
            height:180px;

            border-radius:50%;

            background:
                    conic-gradient(#00d4ff calc(var(--score) * 1%),
                    rgba(255,255,255,0.15) 0);

            display:flex;

            align-items:center;
            justify-content:center;

            margin:auto;

            box-shadow:0 0 30px rgba(0,212,255,0.4);
        }

        .score-inner{

            width:140px;
            height:140px;

            border-radius:50%;

            background:#111;

            display:flex;

            align-items:center;
            justify-content:center;

            flex-direction:column;
        }

        .score-inner h2{

            font-size:42px;

            color:#00d4ff;

            font-weight:bold;
        }

        .score-inner p{

            color:#dcdcdc;

            margin-top:5px;
        }

        .section-card{

            background:rgba(255,255,255,0.08);

            border-radius:20px;

            padding:25px;

            margin-bottom:25px;

            border:1px solid rgba(255,255,255,0.1);
        }

        .section-card h3{

            margin-bottom:18px;

            color:#00d4ff;

            font-weight:bold;
        }

        .skill-badge{

            background:#00d4ff;

            color:black;

            padding:10px 18px;

            border-radius:30px;

            margin:6px;

            display:inline-block;

            font-weight:bold;
        }

        .suggestion-box{

            background:rgba(0,212,255,0.15);

            border-left:5px solid #00d4ff;

            padding:18px;

            border-radius:12px;

            color:#f5f5f5;
        }

        .file-box{

            color:#dcdcdc;
        }

        .btn-custom{

            background:#00d4ff;

            border:none;

            padding:14px 28px;

            border-radius:14px;

            font-size:18px;

            font-weight:bold;

            transition:0.3s;
        }

        .btn-custom:hover{

            background:#00b7db;

            transform:translateY(-2px);
        }

        .button-area{

            text-align:center;

            margin-top:35px;
        }

        @media(max-width:768px){

            .title h1{

                font-size:34px;
            }

            .result-card{

                padding:30px 20px;
            }
        }

    </style>

</head>

<body>

<div class="main-container">

    <div class="result-card">

        <div class="title">

            <h1>
                Resume Analysis Report
            </h1>

            <p>
                AI Powered ATS Resume Evaluation
            </p>

        </div>

        <div class="score-section">

            <div class="score-circle"
                 th:style="'--score:' + ${resume.atsScore}">

                <div class="score-inner">

                    <h2 th:text="${resume.atsScore} + '%'"></h2>

                    <p>ATS Score</p>

                </div>

            </div>

        </div>

        <div class="section-card">

            <h3>
                <i class="fa-solid fa-microchip"></i>
                Skills Detected
            </h3>

            <div>

                <span class="skill-badge"

                      th:each="skill :
                      ${#strings.arraySplit(
                      resume.skills.replace('[','')
                      .replace(']',''), ',')}"

                      th:text="${skill}">

                </span>

            </div>

        </div>

        <div class="section-card">

            <h3>
                <i class="fa-solid fa-lightbulb"></i>
                AI Suggestions
            </h3>

            <div class="suggestion-box">

                <p th:text="${resume.suggestions}"></p>

            </div>

        </div>

        <div class="section-card">

            <h3>
                <i class="fa-solid fa-file"></i>
                Resume Details
            </h3>

            <div class="file-box">

                <p>
                    <strong>File Name:</strong>

                    <span th:text="${resume.fileName}"></span>
                </p>

                <p>
                    <strong>Upload Time:</strong>

                    <span th:text="${resume.uploadTime}"></span>
                </p>

            </div>

        </div>

        <div class="button-area">

            <a href="/"
               class="btn btn-custom">

                Analyze Another Resume

            </a>

        </div>

    </div>

</div>

</body>
</html>
